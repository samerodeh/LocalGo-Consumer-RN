# Render Blueprint for the LocalGO FastAPI backend (backend/).
#
# This file must live at the REPO ROOT for Render's "New Blueprint Instance"
# flow to find it, but the service itself only builds/runs from `backend/`
# (rootDir below) — it never touches the Expo app in this repo.
#
# Free plan trade-off: the instance sleeps after ~15 min with no requests and
# takes 30-50s to wake on the next one. Fine for testing the missing-orders
# fix; if that cold start becomes annoying with real users, upgrade the plan
# in the Render dashboard — no config change needed here.

services:
  - type: web
    name: localgo-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # Secrets: set these in the Render dashboard (Environment tab) after
      # the first deploy. sync: false keeps them out of this committed file,
      # same reason backend/.env and eas.json's env block are handled the way
      # they are — nothing secret goes into git.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Stripe. Without BOTH of the first two, config.STRIPE_CONFIGURED is
      # false and checkout silently runs in demo mode — the app completes an
      # order and no money moves. Use sk_test_/pk_test_ until you are ready to
      # take real payments.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      # Only needed for POST /payments/webhook (orphaned-charge detection).
      # Without it that endpoint returns 503; the rest of checkout is unaffected.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: GOER_MODEL
        value: llama-3.1-8b-instant
      # No CHROMA_PATH: the default (app/goer/chroma_db) is fine on ephemeral
      # storage, since startup re-embeds the menu and FAQ every boot. Budget
      # ~30-60s for the first boot after a deploy — Chroma also downloads its
      # ONNX embedder (~80 MB) then. Set CHROMA_PATH to a mounted disk on a
      # paid instance if you'd rather persist the index across deploys.
